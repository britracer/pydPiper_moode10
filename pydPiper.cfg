[STARTUP]
startup_msg_duration = 5

[DISPLAY]
display_driver = winstar_weg
display_pin_rs = 26
display_pin_e = 27
display_pin_d4 = 25
display_pin_d5 = 24
display_pin_d6 = 23
display_pin_d7 = 22
display_width = 80
display_height = 16
display_enable_duration = .1
pagefile = pages_fixed_moodeRC.py
animation_smoothing = .1

[SYSTEM]
logfile = /var/log/pydPiper.log
loglevel = info
timezone = US/Eastern
time24hour = true
temperature = celsius

[SOURCE]
source_type = moode
mpd_server = localhost
mpd_port = 6600
mpd_password = moodeaudio
